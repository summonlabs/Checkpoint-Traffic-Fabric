# Checkpoint Traffic Fabric coordinator configuration.
#
# Strict key = value format: unknown keys, duplicate keys, malformed numbers, and
# missing required keys are refused with the offending line number.
# Validate with: ctfctl config --config examples/coordinator.conf

label = ctf-coordinator
bind_host = 127.0.0.1
port = 0
data_directory = ./ctf-data
persist = true

worker_threads = 4
max_pending_connections = 64
identity_seed = 66051

# --- Policy -----------------------------------------------------------------
# One envelope per isolation class; ceilings are enforced by the fabric's own
# token buckets, so a sender cannot exceed them by ignoring pacing.
policy.generation = 1
policy.max_wave_width = 8
policy.max_session_bytes = 1073741824
policy.max_sessions = 256
policy.max_attempts_in_flight = 64
policy.retained_history = 128
policy.require_destination_verification = true
policy.defer_horizon_ns = 250000000
policy.default_deadline_ns = 120000000000

policy.envelope.TrainingCritical.ceiling_bps = 33554432
policy.envelope.TrainingCritical.burst_window_ns = 50000000
policy.envelope.TrainingCritical.max_in_flight_sessions = 8

policy.envelope.ServingLatency.ceiling_bps = 16777216
policy.envelope.ServingLatency.burst_window_ns = 50000000
policy.envelope.ServingLatency.max_in_flight_sessions = 8

policy.envelope.TrainingBulk.ceiling_bps = 8388608
policy.envelope.TrainingBulk.burst_window_ns = 100000000
policy.envelope.TrainingBulk.max_in_flight_sessions = 4

policy.envelope.BestEffort.ceiling_bps = 2097152
policy.envelope.BestEffort.burst_window_ns = 100000000
policy.envelope.BestEffort.max_in_flight_sessions = 2

# --- Topology ---------------------------------------------------------------
# Path classes are configured capacity figures, not measured links; the synthetic
# flag states that plainly instead of implying physical validation.
topology.generation = 1

topology.path.1.destination = LocalAttachedStore
topology.path.1.capacity_bps = 67108864
topology.path.1.synthetic = true
topology.path.1.label = synthetic-local

topology.path.2.destination = RemoteObjectStore
topology.path.2.capacity_bps = 33554432
topology.path.2.synthetic = true
topology.path.2.label = synthetic-remote

topology.path.3.destination = PeerNodeMemory
topology.path.3.capacity_bps = 33554432
topology.path.3.synthetic = true
topology.path.3.label = synthetic-peer

topology.path.4.destination = SyntheticLab
topology.path.4.capacity_bps = 67108864
topology.path.4.synthetic = true
topology.path.4.label = synthetic-lab

# --- Workload contracts -----------------------------------------------------
# Replace the workload identity with your own; it is the authority the fabric
# fences against.
contract.11111111-2222-4333-8444-555555555555.generation = 1
contract.11111111-2222-4333-8444-555555555555.isolation = TrainingBulk
contract.11111111-2222-4333-8444-555555555555.ceiling_bps = 8388608
contract.11111111-2222-4333-8444-555555555555.floor_bps = 0
contract.11111111-2222-4333-8444-555555555555.max_in_flight_sessions = 4
contract.11111111-2222-4333-8444-555555555555.max_shards_per_wave = 4
contract.11111111-2222-4333-8444-555555555555.allow_supersession = true
contract.11111111-2222-4333-8444-555555555555.deadline_budget_ns = 120000000000

# --- Resource bounds --------------------------------------------------------
limits.max_shards_per_checkpoint = 4096
limits.max_checkpoint_bytes = 1099511627776
limits.max_sessions = 65536
limits.max_attempts_in_flight = 8192
limits.max_retained_history = 4096
limits.max_wave_width = 64
limits.max_path_classes = 64
limits.max_sessions_per_workload = 64
limits.max_workloads = 4096
limits.max_string_bytes = 256
limits.max_supersession_chain = 8
